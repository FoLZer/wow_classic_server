[package]
name = "gameserver"
version = "0.1.0"
authors = ["FoLZer <folzer.se@gmail.com>"]
edition = "2024"
license.workspace = true

[dependencies]
confy = "2.0.0"
log = "0.4.33"
log4rs = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
packets = { path = "./packets" }
lazy_static = "1.5.0"
rand = "0.10.2"
interprocess = { version = "2.4.3", features = ["tokio"] }
ipc_comms = { path = "../ipc_comms" }
itertools = "0.15.0"
sha1 = "0.11.0"
hex = "0.4.3"
common = { path = "./common" }
chrono = "0.4.45"
concurrent-queue = "2.5.0"
gameobjects = { path = "./gameobjects" }
bit-vec = "0.10.1"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "sqlite", "macros", "migrate" ] }
