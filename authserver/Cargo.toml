[package]
name = "authserver"
version = "0.1.0"
authors = ["FoLZer <folzer.se@gmail.com>"]
edition = "2024"
license.workspace = true

[dependencies]
byteorder = "1.5.0"
confy = "2.0.0"
hex = "0.4.3"
interprocess = { version = "2.4.3", features = ["async", "tokio"] }
itertools = "0.15.0"
lazy_static = "1.5.0"
log = "0.4.33"
num-bigint = "0.5.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
ipc_comms = { path = "../ipc_comms" }
futures = "0.3.34"
authserver_migration = { path = "./authserver_migration" }
sea-orm = { version = "2.0.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
authserver_entity = { path = "./authserver_entity" }
concurrent-queue = "2.5.0"
inquire = "0.9.4"
log4rs = "1.4.0"
inquire-derive = "0.9.4"
